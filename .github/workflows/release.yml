name: release

on:
  push:
    tags: ['*']

permissions:
  contents: read

jobs:

  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v6
        with:
          python-version: '3.11'
      - name: Install packages
        run: pip install build wheel
      - name: Build package
        run: python -m build
      - name: Upload package
        uses: actions/upload-artifact@v7
        with:
          name: dist
          path: dist/

  publish:
    runs-on: ubuntu-latest
    needs: [build]
    environment:
      name: pypi
      url: https://pypi.org/p/aiortc
    permissions:
      id-token: write
    steps:
      - name: Download package
        uses: actions/download-artifact@v8
        with:
          name: dist
          path: dist/
      - name: Publish package
        uses: pypa/gh-action-pypi-publish@release/v1
